<!DOCTYPE html>
<html>
<head>
    <title>X Link</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .link-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .x-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: #1da1f2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #0d8bd9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="link-container">
        <div class="x-logo">𝕏</div>
        <h2>Click below to open X/Twitter</h2>
        <a href="https://x.com/Videoviral33856/status/1977414542557872327" target="_blank" class="btn">Open @Videoviral33856</a>
        <p><small>https://x.com/Videoviral33856/status/1977414542557872327</small></p>
    </div>
</body>
</html>
