<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Video placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1722"/>
      <stop offset="100%" stop-color="#1c2e44"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="-240" y="0" width="220" height="1000" fill="url(#shine)">
    <animate attributeName="x" from="-240" to="1040" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="400" cy="500" r="92" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.36)" stroke-width="4"/>
  <polygon points="372,447 372,553 458,500" fill="#ffffff"/>
</svg>
