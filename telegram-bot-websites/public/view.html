<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>AfterDark Vault - View Media</title>
    <meta name="theme-color" content="#0d0d0d">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/ldrs/dist/auto/cardio.js"></script>
    <!-- Minimal inline styles to make the full-screen view fit perfectly -->
    <style>
        body {
            background: #000;
            color: #fff;
        }

        .view-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 100vh;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .media-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-1);
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
        }

        .media-container video,
        .media-container img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }

        .meta-panel {
            background: var(--bg-1);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--line);
        }

        .meta-title {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .meta-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Responsive Suggested Grid */
        .suggested-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .suggested-title {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--text);
        }

        .suggested-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        }

        .suggested-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .suggested-thumb {
            background: var(--bg-2);
            border-radius: var(--radius-sm);
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
        }

        .suggested-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-base);
        }

        .suggested-card:hover .suggested-thumb img {
            transform: scale(1.05);
        }

        .suggested-duration {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.8);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .suggested-item-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .suggested-item-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .suggested-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .meta-panel {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="view-container" id="appRoot">
        <div class="header-actions">
            <a href="/" class="btn btn-ghost" style="color: var(--accent);">← Back to Gallery</a>
            <div class="top-actions">
                <!-- We will dynamically inject download/copy links here via JS -->
            </div>
        </div>

        <div id="mediaWrapper" class="media-container" style="min-height: 50vh; position: relative;">
            <div class="skeleton" style="position: absolute; inset: 0;" aria-hidden="true"></div>
            <div id="viewLoadingIndicator"
                style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10;">
                <l-cardio size="50" stroke="4" speed="2" color="var(--accent)"></l-cardio>
                <p
                    style="color: var(--text-muted); font-size: 14px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px;">
                    Loading Media...</p>
            </div>
        </div>

        <div class="meta-panel" id="metaPanel">
            <h1 class="meta-title" id="mediaTitle">Loading...</h1>
            <p class="meta-subtitle" id="mediaDate">Please wait</p>

            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line-soft);">
                <p
                    style="color: var(--text-secondary); margin-bottom: 8px; font-weight: bold; text-transform: uppercase; font-size: 12px;">
                    AI Insight or Caption</p>
                <p id="mediaDesc" style="color: var(--text-secondary); line-height: 1.6;"></p>
            </div>

            <div class="suggested-section hidden" id="suggestedSection">
                <h3 class="suggested-title">Up Next</h3>
                <div class="suggested-grid" id="suggestedGrid"></div>
            </div>
        </div>
    </div>

    <script src="/js/view.js"></script>
</body>

</html>
