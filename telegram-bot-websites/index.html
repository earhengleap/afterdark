<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AfterDark Vault</title>
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="title-wrap">
        <span class="title-badge">18+</span>
        <div>
          <h1>AfterDark Vault</h1>
          <p id="sessionText">Connecting Telegram Mini App...</p>
        </div>
      </div>
      <button id="syncBtn" class="btn btn-ghost" type="button">Sync</button>
    </header>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="Search caption or filename">
      <div class="tabs">
        <button class="tab active" data-filter="all" type="button">All</button>
        <button class="tab" data-filter="video" type="button">Videos</button>
        <button class="tab" data-filter="image" type="button">Images</button>
      </div>
      <div class="meta-row">
        <span id="countText">0 items</span>
        <span id="syncText">Not synced</span>
      </div>
    </section>

    <section class="stats">
      <article><small>Total</small><strong id="statTotal">0</strong></article>
      <article><small>Videos</small><strong id="statVideos">0</strong></article>
      <article><small>Images</small><strong id="statImages">0</strong></article>
      <article><small>Storage</small><strong id="statSize">0 MB</strong></article>
    </section>

    <main>
      <div id="grid" class="grid"></div>
      <div id="emptyState" class="empty hidden">
        <p>No media found.</p>
      </div>
    </main>
  </div>

  <aside id="viewer" class="viewer hidden" aria-hidden="true">
    <div class="viewer-shell">
      <button id="closeViewer" class="viewer-close" type="button">Close</button>
      <div id="viewerMedia" class="viewer-media"></div>
      <div class="viewer-info">
        <h2 id="viewerTitle">Media</h2>
        <p id="viewerCaption">No caption</p>
        <div class="chips">
          <span id="viewerType">-</span>
          <span id="viewerSize">-</span>
          <span id="viewerDate">-</span>
        </div>
        <a id="viewerDownload" class="btn btn-primary" href="#" download>Download</a>
      </div>
    </div>
  </aside>

  <template id="cardTemplate">
    <article class="card">
      <button class="card-btn" type="button">
        <div class="thumb"></div>
        <div class="card-body">
          <p class="card-title"></p>
          <p class="card-subtitle"></p>
        </div>
      </button>
    </article>
  </template>

  <script src="/script.js"></script>
</body>
</html>
